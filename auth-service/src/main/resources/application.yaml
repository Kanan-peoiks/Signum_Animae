server:
  port: 8081

spring:
  application:
    name: auth-user-service
  cloud:
    openfeign:
      httpclient:
        hc5:
          enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/signum_animae_authservice
    username: ${Username}
    password: ${Password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
internal:
  service-token: ${INTERNAL_SERVICE_TOKEN:local-dev-internal-token}

services:
  notification-service:
    url: http://localhost:8085

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5500}
