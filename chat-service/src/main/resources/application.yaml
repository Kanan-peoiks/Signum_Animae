server:
  port: 8083

spring:
  application:
    name: chat-service
  cloud:
    openfeign:
      httpclient:
        hc5:
          enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/signum_animae_chatservice
    username: ${Username}
    password: ${Password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379

services:
  booking-service:
    url: http://localhost:8089
