server:
  port: 8083

spring:
  application:
    name: chat-service
  cloud:
    openfeign:
      httpclient:
        hc5:
          enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:signum_animae_chatservice}
    username: ${Username}
    password: ${Password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET}

services:
  booking-service:
    url: ${BOOKING_SERVICE_URL:http://localhost:8089}

internal:
  service-token: ${INTERNAL_SERVICE_TOKEN:local-dev-internal-token}
