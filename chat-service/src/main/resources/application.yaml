server:
  port: 8083

spring:
  application:
    name: chat-service
  cloud:
    openfeign:
      httpclient:
        hc5:
          enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/signum_animae_chatservice
    username: ${Username}
    password: ${Password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379

# WebSocket handshake-ini yoxlamaq üçün - gateway WS upgrade-ini proxy edə bilmədiyi
# üçün klient birbaşa buraya qoşulur, bax PresenceHandshakeInterceptor.
# Gateway və auth-service ilə EYNİ secret olmalıdır.
jwt:
  secret: ${JWT_SECRET}

services:
  booking-service:
    url: http://localhost:8089

internal:
  service-token: ${INTERNAL_SERVICE_TOKEN:local-dev-internal-token}
