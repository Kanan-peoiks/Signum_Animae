server:
  port: 8085

spring:
  application:
    name: notification-service
  cloud:
    openfeign:
      httpclient:
        hc5:
          enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:signum_animae_notificationservice}
    username: ${Username}
    password: ${Password}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

services:
  auth-service:
    url: ${AUTH_SERVICE_URL:http://localhost:8081}

internal:
  service-token: ${INTERNAL_SERVICE_TOKEN:local-dev-internal-token}
