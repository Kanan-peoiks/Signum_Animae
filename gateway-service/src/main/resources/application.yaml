server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/auth/**
            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/users/**
            - id: artist-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/artists/**
            - id: booking-service
              uri: http://localhost:8089
              predicates:
                - Path=/api/v1/bookings/**
            - id: review-service
              uri: http://localhost:8089
              predicates:
                - Path=/api/v1/reviews/**
            - id: chat-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/chat/**
            - id: chat-websocket
              uri: http://localhost:8083
              predicates:
                - Path=/ws-tattoo/**
            - id: ai-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/v1/ai/**
            - id: notification-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/v1/notifications/**

jwt:
  secret: ${JWT_SECRET}

# Comma-separated allowed origins for the frontend - see CorsConfig. Left as "*" for
# now (matches previous behaviour); set CORS_ALLOWED_ORIGINS before deploying anywhere
# beyond localhost.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
