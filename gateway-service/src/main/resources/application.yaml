server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**
            - id: user-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/users/**
            - id: artist-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/artists/**
            - id: artist-follow-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/follows/**
            - id: booking-service
              uri: ${BOOKING_SERVICE_URL:http://localhost:8089}
              predicates:
                - Path=/api/v1/bookings/**
            - id: review-service
              uri: ${BOOKING_SERVICE_URL:http://localhost:8089}
              predicates:
                - Path=/api/v1/reviews/**
            - id: availability-service
              uri: ${BOOKING_SERVICE_URL:http://localhost:8089}
              predicates:
                - Path=/api/v1/availability/**
            - id: chat-service
              uri: ${CHAT_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/chat/**
            - id: chat-websocket
              uri: ${CHAT_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/ws-tattoo/**
            - id: ai-service
              uri: ${AI_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/ai/**
            - id: ai-ideas-service
              uri: ${BOOKING_SERVICE_URL:http://localhost:8089}
              predicates:
                - Path=/api/v1/ai-ideas/**
            - id: admin-stats-users-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/admin/stats/users
            - id: admin-stats-bookings-service
              uri: ${BOOKING_SERVICE_URL:http://localhost:8089}
              predicates:
                - Path=/api/v1/admin/stats/bookings
            - id: admin-users-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/admin/users/**
            - id: admin-reviews-service
              uri: ${BOOKING_SERVICE_URL:http://localhost:8089}
              predicates:
                - Path=/api/v1/admin/reviews/**
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/notifications/**

jwt:
  secret: ${JWT_SECRET}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
