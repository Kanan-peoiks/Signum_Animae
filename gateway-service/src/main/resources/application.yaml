server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**, /api/v1/artists/**

        - id: booking-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/bookings/**, /api/v1/reviews/**

        - id: chat-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/chat/**, /ws-tattoo/**

        - id: ai-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/ai/**

        - id: notification-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/notifications/**

jwt:
  secret: ${JWT_SECRET}