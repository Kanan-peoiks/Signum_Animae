server:
  port: 8089

spring:
  application:
    name: booking-service
  cloud:
    openfeign:
      httpclient:
        hc5:
          enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/signum_animae_bookingservice
    username: ${Username}
    password: ${Password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

services:
  auth-service:
    url: http://localhost:8081

internal:
  service-token: ${INTERNAL_SERVICE_TOKEN:local-dev-internal-token}
