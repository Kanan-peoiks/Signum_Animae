# SIGNUM ANIMAE — bütün sistem lokalda konteyner kimi.
#
# Məqsəd: Azure-a çıxmazdan ƏVVƏL eyni quruluşu burada sınamaq. Azure-da
# xəta axtarmaq həm yavaş, həm bahalıdır; burada hər şey bir əmrlə qalxır.
#
#   docker compose up --build        qaldır
#   docker compose down              dayandır
#   docker compose down -v           dayandır və bazaları da sil
#
# Lazımi dəyişənlər üçün .env faylı yarat (nümunə: .env.example).

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-p1234}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 4 bazanı ilk qalxanda yaradır
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    # Yaddaşda saxlanan sayğac və presence üçündür - itsə sistem işləməyə
    # davam edir (hər iki istifadə "fail-open"dur), ona görə volume yoxdur.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-service:
    build: ./auth-service
    environment:
      DB_HOST: postgres
      DB_NAME: signum_animae_authservice
      Username: ${DB_USER:-postgres}
      Password: ${DB_PASSWORD:-p1234}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-dev-internal-token}
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5500}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  booking-service:
    build: ./booking-service
    environment:
      DB_HOST: postgres
      DB_NAME: signum_animae_bookingservice
      Username: ${DB_USER:-postgres}
      Password: ${DB_PASSWORD:-p1234}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-dev-internal-token}
      AUTH_SERVICE_URL: http://auth-service:8081
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
    depends_on:
      postgres: { condition: service_healthy }

  chat-service:
    build: ./chat-service
    # WebSocket gateway-dən keçmir, ona görə bu servis birbaşa açıqdır.
    # REST tərəfini JwtHeaderFilter qoruyur.
    ports:
      - "8083:8083"
    environment:
      DB_HOST: postgres
      DB_NAME: signum_animae_chatservice
      Username: ${DB_USER:-postgres}
      Password: ${DB_PASSWORD:-p1234}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-dev-internal-token}
      BOOKING_SERVICE_URL: http://booking-service:8089
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  notification-service:
    build: ./notification-service
    environment:
      DB_HOST: postgres
      DB_NAME: signum_animae_notificationservice
      Username: ${DB_USER:-postgres}
      Password: ${DB_PASSWORD:-p1234}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-dev-internal-token}
      AUTH_SERVICE_URL: http://auth-service:8081
      # Lokal sınaqda email GETMİR: mailpit tutur, brauzerdən baxırsan.
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-dummy}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-dummy}
      MAIL_FROM: ${MAIL_FROM:-signum@localhost}
    depends_on:
      postgres: { condition: service_healthy }

  ai-service:
    build: ./ai-service
    environment:
      KEY: ${KEY:-}

  gateway-service:
    build: ./gateway-service
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      AUTH_SERVICE_URL: http://auth-service:8081
      BOOKING_SERVICE_URL: http://booking-service:8089
      CHAT_SERVICE_URL: http://chat-service:8083
      AI_SERVICE_URL: http://ai-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
    depends_on:
      - auth-service
      - booking-service
      - chat-service
      - notification-service
      - ai-service

  frontend:
    image: nginx:alpine
    ports:
      - "5500:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro

  # Lokal SMTP tutucusu - göndərilən məktublar internetə ÇIXMIR,
  # http://localhost:8025 ünvanından baxılır.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

volumes:
  pgdata:
