# ============================================================
#  Keş qaydaları. Əvvəllər heç bir Cache-Control başlığı yox idi və brauzer
#  özü qərar verirdi: deploy-dan sonra yeni HTML köhnə CSS/JS ilə qarışırdı.
# ============================================================
server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Bu faylın özü sayt məzmunu deyil
    location = /nginx.conf { return 404; }

    # HTML, CSS, JS: hər dəfə serverdən soruşulur. Fayl dəyişməyibsə nginx
    # ETag ilə "304 Not Modified" qaytarır - yükləmə olmur, amma köhnə
    # versiya da ilişib qalmır.
    location ~* \.(?:html|css|js)$ {
        add_header Cache-Control "no-cache";
    }

    # Şəkillər: bir saatlıq keş. Adları sabit olduğu üçün (favicon.png,
    # assets/photos/...) daha uzun müddət qoymuruq.
    location ~* \.(?:png|jpe?g|webp|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
